<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form_title }}</title>
</head>
<body>

    <h1>{{ form_title }}</h1>

    <form method="POST">

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ student.name if student else '' }}"
            required
        >
        <br><br>

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ student.email if student else '' }}"
            required
        >
        <br><br>

        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ student.phone if student else '' }}"
        >
        <br><br>

        <label>Gender</label>
        <select name="gender">

            <option value="Male"
                {% if student and student.gender == "Male" %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
                {% if student and student.gender == "Female" %}selected{% endif %}>
                Female
            </option>

        </select>
        <br><br>

        <label>Course</label>
        <select name="course_id" required>

            <option value="">Select Course</option>

            {% for course in courses %}
            <option
                value="{{ course.id }}"
                {% if student and student.course_id == course.id %}selected{% endif %}
            >
                {{ course.name }}
            </option>
            {% endfor %}

        </select>
        <br><br>

        <label>Date of Birth</label>
        <input
            type="date"
            name="date_of_birth"
            value="{{ student.date_of_birth if student else '' }}"
        >
        <br><br>

        <label>Status</label>
        <select name="status">

            <option value="Active"
                {% if student and student.status == "Active" %}selected{% endif %}>
                Active
            </option>

            <option value="Inactive"
                {% if student and student.status == "Inactive" %}selected{% endif %}>
                Inactive
            </option>

        </select>
        <br><br>

        <button type="submit">
            {% if student %}
                Update Student
            {% else %}
                Save Student
            {% endif %}
        </button>

    </form>

</body>
</html>
